[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "familydash"
dynamic = ["version"]
description = "Family dashboard for a Roku TV: Skylight chores, stars and calendar rendered as a full-screen image"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["playwright>=1.55,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
familydash = "familydash.__main__:main"

[tool.setuptools]
packages = ["familydash"]

[tool.setuptools.dynamic]
version = { attr = "familydash.__version__" }

[tool.setuptools.package-data]
familydash = ["style.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: renders pages in headless Chromium (needs `playwright install chromium`)"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B023"]
